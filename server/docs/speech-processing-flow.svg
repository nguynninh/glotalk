<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1190" viewBox="0 0 1100 1190" role="img" aria-labelledby="title desc">
<title id="title">ONPlay STT — current implementation</title><desc id="desc">Two input paths: browser PCM streaming through WebSocket to C++ STT, and mobile WAV uploads to offline speaker diarization and STT. Optional text translation uses the local translation router.</desc>
<rect width="1100" height="1190" rx="16" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#172033">
<text x="550" y="34" font-size="22" font-weight="700">ONPlay STT — current implementation</text>
<text x="285" y="67" font-size="14" fill="#172033" font-weight="700">WEB UI · localhost:8765</text>
<text x="815" y="67" font-size="14" fill="#172033" font-weight="700">MOBILE · HTTPS API</text>
<rect x="30" y="85" width="510" height="90" rx="12" fill="#e9eefb" stroke="#dce2eb"/>
<text x="285.0" y="110" font-size="15" fill="#172033" font-weight="700">Audio / video file in browser</text>
<text x="285.0" y="132" font-size="12" fill="#526071" font-weight="400">Local media decoding → AudioWorklet</text>
<text x="285.0" y="150" font-size="12" fill="#526071" font-weight="400">PCM16 · mono · 16 kHz chunks</text>
<rect x="560" y="85" width="510" height="90" rx="12" fill="#e9eefb" stroke="#dce2eb"/>
<text x="815.0" y="110" font-size="15" fill="#172033" font-weight="700">Android / iOS client · audio in → audio out</text>
<text x="815.0" y="132" font-size="12" fill="#526071" font-weight="400">Raw WAV · PCM16 · mono · 16 kHz</text>
<text x="815.0" y="150" font-size="12" fill="#526071" font-weight="400">Maximum 60 seconds · 2 MiB</text>
<path d="M285 175 V201 m-5 -6 5 6 5 -6" fill="none" stroke="#7c899a" stroke-width="1.5"/>
<path d="M815 175 V201 m-5 -6 5 6 5 -6" fill="none" stroke="#7c899a" stroke-width="1.5"/>
<rect x="30" y="205" width="510" height="90" rx="12" fill="#eef2ff" stroke="#dce2eb"/>
<text x="285.0" y="230" font-size="15" fill="#172033" font-weight="700">Python WebSocket bridge · ui/ws_stream.py</text>
<text x="285.0" y="252" font-size="12" fill="#526071" font-weight="400">localhost:8766 or HTTPS /ws</text>
<text x="285.0" y="270" font-size="12" fill="#526071" font-weight="400">Validate config + PCM → C++ process stdin</text>
<rect x="560" y="205" width="510" height="90" rx="12" fill="#eef2ff" stroke="#dce2eb"/>
<text x="815.0" y="230" font-size="15" fill="#172033" font-weight="700">POST /api/transcribe or /api/translate-audio?target=…</text>
<text x="815.0" y="252" font-size="12" fill="#526071" font-weight="400">Validate WAV + limits → temporary local file</text>
<text x="815.0" y="270" font-size="12" fill="#526071" font-weight="400">Shared inference lock with WebSocket sessions</text>
<path d="M285 295 V321 m-5 -6 5 6 5 -6" fill="none" stroke="#7c899a" stroke-width="1.5"/>
<path d="M815 295 V321 m-5 -6 5 6 5 -6" fill="none" stroke="#7c899a" stroke-width="1.5"/>
<rect x="30" y="325" width="510" height="90" rx="12" fill="#eef2ff" stroke="#dce2eb"/>
<text x="285.0" y="350" font-size="15" fill="#172033" font-weight="700">C++ streaming STT · sherpa-onnx</text>
<text x="285.0" y="372" font-size="12" fill="#526071" font-weight="400">Multilingual Zipformer · endpoint detection</text>
<text x="285.0" y="390" font-size="12" fill="#526071" font-weight="400">Optional CAM++ provisional live speaker labels</text>
<rect x="560" y="325" width="510" height="90" rx="12" fill="#eef2ff" stroke="#dce2eb"/>
<text x="815.0" y="350" font-size="15" fill="#172033" font-weight="700">C++ offline speaker pipeline</text>
<text x="815.0" y="372" font-size="12" fill="#526071" font-weight="400">Pyannote segmentation → CAM++ clustering</text>
<text x="815.0" y="390" font-size="12" fill="#526071" font-weight="400">Zipformer transcription of each detected turn</text>
<path d="M285 415 V441 m-5 -6 5 6 5 -6" fill="none" stroke="#7c899a" stroke-width="1.5"/>
<path d="M815 415 V441 m-5 -6 5 6 5 -6" fill="none" stroke="#7c899a" stroke-width="1.5"/>
<rect x="30" y="445" width="510" height="90" rx="12" fill="#e5f3ec" stroke="#dce2eb"/>
<text x="285.0" y="470" font-size="15" fill="#172033" font-weight="700">WebSocket transcript events</text>
<text x="285.0" y="492" font-size="12" fill="#526071" font-weight="400">partial / final → browser immediately</text>
<text x="285.0" y="510" font-size="12" fill="#526071" font-weight="400">Final segments → optional translation worker</text>
<rect x="560" y="445" width="510" height="90" rx="12" fill="#e5f3ec" stroke="#dce2eb"/>
<text x="815.0" y="470" font-size="15" fill="#172033" font-weight="700">Segments → JSON client OR server translation</text>
<text x="815.0" y="492" font-size="12" fill="#526071" font-weight="400">text + speaker + start / end</text>
<text x="815.0" y="510" font-size="12" fill="#526071" font-weight="400">Text mode: client calls POST /api/translate per segment</text>
<path d="M285 535 V561 m-5 -6 5 6 5 -6" fill="none" stroke="#7c899a" stroke-width="1.5"/>
<rect x="30" y="565" width="510" height="90" rx="12" fill="#eef2ff" stroke="#dce2eb"/>
<text x="285.0" y="590" font-size="15" fill="#172033" font-weight="700">Optional refinement after playback</text>
<text x="285.0" y="612" font-size="12" fill="#526071" font-weight="400">Up to 10 min: Pyannote + CAM++ + per-turn STT</text>
<text x="285.0" y="630" font-size="12" fill="#526071" font-weight="400">speakers events + refined translations with timestamps</text>
<rect x="560" y="565" width="510" height="90" rx="12" fill="#fafafa" stroke="#dce2eb"/>
<text x="815.0" y="590" font-size="15" fill="#172033" font-weight="700">Manual transcript translation in web UI</text>
<text x="815.0" y="612" font-size="12" fill="#526071" font-weight="400">POST /api/translate</text>
<text x="815.0" y="630" font-size="12" fill="#526071" font-weight="400">Also used to translate edited transcript text</text>
<path d="M285 655 V680 H550 V705 M815 655 V680 H550 M815 535 V548 H1084 V680 H550" fill="none" stroke="#7c899a" stroke-width="1.5"/>
<rect x="80" y="710" width="940" height="110" rx="12" fill="#eef2ff" stroke="#dce2eb"/>
<text x="550.0" y="735" font-size="15" fill="#172033" font-weight="700">Local translation router · localhost:5002</text>
<text x="550.0" y="757" font-size="12" fill="#526071" font-weight="400">Text language detection (Lingua) → configured model route → validation + bounded cache</text>
<text x="550.0" y="775" font-size="12" fill="#526071" font-weight="400">Standard: CTranslate2 INT8 OPUS for en / vi / zh routes; NLLB default / fallback</text>
<text x="550.0" y="793" font-size="12" fill="#526071" font-weight="400">Explicit context mode: Qwen3-1.7B with NLLB fallback</text>
<path d="M550 820 V846 m-5 -6 5 6 5 -6" fill="none" stroke="#7c899a" stroke-width="1.5"/>
<rect x="80" y="850" width="940" height="90" rx="12" fill="#e5f3ec" stroke="#dce2eb"/>
<text x="550.0" y="875" font-size="15" fill="#172033" font-weight="700">Translation results</text>
<text x="550.0" y="897" font-size="12" fill="#526071" font-weight="400">WebSocket: separate translation events matched by revision + segment ID</text>
<text x="550.0" y="915" font-size="12" fill="#526071" font-weight="400">HTTP text mode: translation JSON · audio mode: server sends translated text to TTS</text>
<path d="M550 940 V966 m-5 -6 5 6 5 -6" fill="none" stroke="#7c899a"/><rect x="80" y="970" width="940" height="95" rx="12" fill="#e5f3ec" stroke="#dce2eb"/><text x="550" y="997" font-size="15" font-weight="700">Optional translated speech · POST /api/tts</text><text x="550" y="1020" font-size="12">Translated text + target language → local KorvaTTS voice → PCM16 WAV</text><text x="550" y="1041" font-size="12">Audio mode: one upload request returns translated WAV · client saves / plays bytes</text><rect x="80" y="1093" width="940" height="70" rx="12" fill="#fafafa" stroke="#dce2eb"/>
<text x="550.0" y="1118" font-size="15" fill="#172033" font-weight="700">Resource monitor · localhost:8767</text>
<text x="550.0" y="1140" font-size="12" fill="#526071" font-weight="400">CPU / RAM / process metrics displayed in the web UI · separate from inference</text>
</g></svg>
