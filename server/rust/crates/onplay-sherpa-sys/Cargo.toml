[package]
name = "onplay-sherpa-sys"
description = "Raw bindings to the Sherpa ONNX v2.0.1 C API, generated from the pinned header"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
links = "sherpa-onnx-c-api"
build = "build.rs"

[build-dependencies]
bindgen.workspace = true

# Raw FFI: unsafe is the point of this crate, so it does not inherit `unsafe_code = "forbid"`.
[lints.clippy]
all = { level = "warn", priority = -1 }
