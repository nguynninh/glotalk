[package]
name = "glotalk-editor"
version = "0.1.0"
description = "Glotalk Editor - OCR, dịch, lồng tiếng và xuất video"
authors = ["Glotalk"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "glotalk_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-dialog = "2"
oar-ocr = { version = "0.10.2", features = ["auto-download"] }
image = { version = "0.25.10", default-features = false }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Bản dev: bỏ thông tin debug của thư viện để thư mục target nhỏ hơn nhiều,
# và tối ưu thư viện ngoài để OCR (ONNX, xử lý ảnh) chạy nhanh khi test.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
