[package]
name = "glotalk-editor"
version = "0.3.1"
description = "Glotalk Editor - OCR, dịch, lồng tiếng và xuất video"
authors = ["Glotalk"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "glotalk_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-dialog = "2"
oar-ocr = { version = "0.10.2", features = ["auto-download"] }
image = { version = "0.25.10", default-features = false }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.54.1", features = ["time", "sync", "macros"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
# Cùng phiên bản oar-ocr dùng, để chạy model đặc trưng giọng mà không kéo thêm ONNX Runtime thứ hai.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std"] }
rustfft = "6.4.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Bản dev: bỏ thông tin debug của thư viện để thư mục target nhỏ hơn nhiều,
# và tối ưu thư viện ngoài để OCR (ONNX, xử lý ảnh) chạy nhanh khi test.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

# Mã quét OCR của app (TextMask) chạy mỗi frame: không tối ưu thì chậm ~12 lần.
[profile.dev.package.glotalk-editor]
opt-level = 1
